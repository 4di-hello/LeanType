name: My LeanType build
# Only for this fork:
# - weekly (and on demand): rebase the branch "daily" with my features onto the current LeanType,
#   run the tests and build the APK
# - on every push to "daily": run the tests and build the APK
# The APK is published as a GitHub release (latest: releases/latest/download/LeanTypePlus.apk) when the app
# changed, and also stored on the branch apk-out. A failed run (e.g. a conflict) is reported by GitHub by mail.

on:
  schedule:
    - cron: '17 3 * * 1' # Monday morning
  workflow_dispatch:
  push:
    branches: [ daily ]

permissions:
  contents: write

concurrency:
  group: my-leantype
  cancel-in-progress: false

jobs:
  build:
    # fixed version, so a change of ubuntu-latest can't break the build unnoticed
    runs-on: ubuntu-24.04
    steps:
      # third-party actions are pinned to a commit: a tag could later point to other code
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: daily
          fetch-depth: 0

      - name: Update with the current LeanType
        if: github.event_name != 'push'
        run: |
          git config user.name 4di-hello
          git config user.email 4di-hello@users.noreply.github.com
          git remote add upstream https://github.com/LeanBitLab/LeanType.git
          git fetch -q upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "::notice::already up to date"
          elif git rebase upstream/main; then
            echo "UPDATED=1" >> "$GITHUB_ENV"
            echo "::notice::rebased onto $(git rev-parse --short upstream/main)"
          else
            echo "::error::conflict while updating, files: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
            git rebase --abort
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew testStandardRunTestsUnitTest \
            --tests "helium314.keyboard.latin.InputLogicTest" \
            --tests "helium314.keyboard.latin.suggestions.SuggestionStripLayoutHelperTest" \
            --tests "helium314.keyboard.latin.heatmap.TypingHeatmapTest" \
            --tests "helium314.keyboard.keyboard.KeyboardThemeTest" \
            --tests "helium314.keyboard.latin.backup.BackupCryptoTest" \
            --tests "helium314.keyboard.latin.utils.TextExpanderTextTest" \
            --tests "helium314.keyboard.latin.utils.TextExpanderUtilsTest" \
            --continue 2>&1 | tee gradle.log || true
          grep -E "^e: " gradle.log | head -20 | sed 's/^/::error::/' || true
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          # these LeanType tests also fail without my changes (Robolectric permission problem)
          known = lambda name: name.startswith("caps")
          files = glob.glob('app/build/test-results/**/*.xml', recursive=True)
          if not files:
              print("::error::no test results (compile error?)"); sys.exit(1)
          bad = 0
          for f in files:
              root = ET.parse(f).getroot()
              print(f"::notice title={root.get('name')}::tests={root.get('tests')} failures={root.get('failures')} errors={root.get('errors')}")
              for tc in root.iter('testcase'):
                  if (tc.find('failure') is not None or tc.find('error') is not None) and not known(tc.get('name')):
                      bad += 1
                      print(f"::error title={tc.get('name')}::test failed")
          sys.exit(1 if bad else 0)
          PY

      - name: Use the fixed key (secret DEBUG_KEYSTORE_B64)
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::secret DEBUG_KEYSTORE_B64 is missing, without it the APK can't be installed over the previous one"
            exit 1
          fi
          echo "$DEBUG_KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/personal.keystore"
          echo "PERSONAL_KEYSTORE=$RUNNER_TEMP/personal.keystore" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$RUNNER_TEMP/personal.keystore" -storepass android | grep -m1 "SHA256:" | sed 's/^ */::notice title=key::/'

      - name: Build APK
        run: |
          # shown in About, matches the release name
          export FORK_BUILD_INFO="$(date -u +%d.%m.%Y) ($(git rev-parse --short HEAD))"
          ./gradlew assembleOfflinePersonal

      - name: Check that the APK has the fixed key
        run: |
          apk=$(find app/build/outputs/apk -name '*.apk' | head -1)
          want=$(keytool -list -v -keystore "$PERSONAL_KEYSTORE" -storepass android | grep -m1 "SHA256:" | awk '{print $2}')
          got=$(keytool -printcert -jarfile "$apk" | grep -m1 "SHA256:" | awk '{print $2}')
          echo "::notice title=apk key::$got"
          if [ "$want" != "$got" ]; then echo "::error::APK is not signed with the fixed key"; exit 1; fi

      - name: Store updated branch
        if: env.UPDATED == '1'
        run: git push --force-with-lease origin HEAD:daily

      - name: Push APK to branch apk-out
        run: |
          mkdir /tmp/out
          find app/build/outputs/apk -name '*.apk' -exec cp {} /tmp/out/ \;
          cd /tmp/out
          git init -q -b apk-out
          git config user.name 4di-hello
          git config user.email 4di-hello@users.noreply.github.com
          git add .
          git commit -q -m "APK for $(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-out

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # always this fork, gh would otherwise pick the remote "upstream" (LeanType)
          GH_REPO: ${{ github.repository }}
        run: |
          git fetch -q --tags origin
          git remote get-url upstream >/dev/null 2>&1 || git remote add upstream https://github.com/LeanBitLab/LeanType.git
          git fetch -q upstream main
          prev=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev^{commit}" >/dev/null \
             && git diff --quiet "$prev" HEAD -- app build.gradle.kts gradle settings.gradle.kts; then
            echo "::notice::app unchanged since $prev, no new release"
            exit 0
          fi
          sha=$(git rev-parse --short HEAD)
          base=$(git rev-parse --short upstream/main)
          tag="plus-$(date -u +%Y-%m-%d-%H%M)-$sha"
          cp "$(find app/build/outputs/apk -name '*.apk' | head -1)" "$RUNNER_TEMP/LeanTypePlus.apk"
          {
            echo "LeanType+ $(date -u +%d.%m.%Y), based on LeanType ${base}. Install over the previous version, nothing is lost."
            echo
            echo "### My changes on top of LeanType"
            git log --reverse --format='- %s' upstream/main..HEAD | grep -v -e '^- Fork only' -e '^- Fix duplicates' || true
            prevbase=""
            if [ -n "$prev" ]; then
              prevbase=$(gh release view "$prev" --json body --jq .body 2>/dev/null | grep -o 'base: [0-9a-f]*' | head -1 | cut -d' ' -f2 || true)
            fi
            if [ -n "$prevbase" ] && [ "$prevbase" != "$base" ] && git cat-file -e "$prevbase^{commit}" 2>/dev/null; then
              echo
              echo "### New in LeanType since the last release"
              git log --no-merges --format='- %s' "$prevbase..upstream/main" | grep -v -e 'README badges' -e '^- docs' | head -40 || true
            fi
            echo
            echo "<!-- base: ${base} -->"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" "$RUNNER_TEMP/LeanTypePlus.apk" --target "$(git rev-parse HEAD)" \
            --title "LeanType+ $(date -u +%d.%m.%Y) ($sha)" --notes-file "$RUNNER_TEMP/notes.md" --latest
          # keep the last 10 releases
          gh release list --limit 100 --json tagName --jq '.[10:][].tagName' | while read -r old; do
            gh release delete "$old" --yes --cleanup-tag
          done
