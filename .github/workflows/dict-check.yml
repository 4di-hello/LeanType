name: Dictionary check
on:
  push:
    branches: [ ci/dict-check ]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Compile test
        run: |
          raw=https://codeberg.org/Helium314/aosp-dictionaries/raw/branch/main
          curl -fsSL -o dicttool.jar $raw/dicttool_aosp.jar
          unzip -l dicttool.jar | grep -i "\.so\|native\|lib" | head
          printf 'dictionary=main:de,locale=de,description=test,date=1700000000,version=1\n word=der,f=254\n  bigram=Mann,f=3\n word=Mann,f=200\n' > t.combined
          java -jar dicttool.jar makedict -s t.combined -d t.dict 2>&1 | tail -15; ls -la t.dict || true
          java -Djava.library.path=. -jar dicttool.jar makedict -s t.combined -d t2.dict 2>&1 | tail -3 || true
