name: Dictionary check
on:
  push:
    branches: [ ci/dict-check ]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Scripts
        run: |
          raw=https://codeberg.org/Helium314/aosp-dictionaries/raw/branch/main
          for f in wordlist_combined.py examples.py; do curl -fsSL -o $f $raw/scripts/$f; done
          echo "===== compile in wordlist_combined.py"; grep -n "def \|dicttool\|subprocess\|java" wordlist_combined.py | head -60
          echo "===== examples.py"; head -80 examples.py
          echo "===== German source"; curl -fsSL $raw/wordlists/main_de.source || true
          echo "===== Leipzig German corpora"; curl -fsSL https://wortschatz.uni-leipzig.de/en/download/German | grep -o 'deu_[a-z0-9_-]*_[0-9]*[KM]' | sort -u | head -60 || true
