name: Dictionary check
# Only for this fork: whether the German dictionaries contain word pairs (bigrams)
on:
  push:
    branches: [ ci/dict-check ]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Inspect
        run: |
          raw=https://codeberg.org/Helium314/aosp-dictionaries/raw/branch/main
          curl -fsSL -o dicttool.jar $raw/dicttool_aosp.jar
          java -jar dicttool.jar help 2>&1 | head -40 || true
          for f in main_de.dict main_de__legacy.dict; do
            curl -fsSL -o $f $raw/dictionaries/$f
            echo "===== $f"
            java -jar dicttool.jar info $f 2>&1 | head -40 || true
            java -jar dicttool.jar makedict -s $f -w ${f%.dict}.combined 2>&1 | tail -5 || true
            if [ -f ${f%.dict}.combined ]; then
              echo "lines: $(wc -l < ${f%.dict}.combined)"
              echo "words: $(grep -c '^ word=' ${f%.dict}.combined)"
              echo "bigram lines: $(grep -c 'bigram=' ${f%.dict}.combined)"
              grep -m5 'bigram=' ${f%.dict}.combined || true
              grep -m8 '^ word=' ${f%.dict}.combined || true
            fi
          done
