name: Dictionary check
on:
  push:
    branches: [ ci/dict-check ]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect
        run: |
          raw=https://codeberg.org/Helium314/aosp-dictionaries/raw/branch/main
          api=https://codeberg.org/api/v1/repos/Helium314/aosp-dictionaries/contents
          echo "===== README"; curl -fsSL $raw/README.md | head -80
          echo "===== scripts"; curl -fsS "$api/scripts" | python3 -c 'import json,sys; [print(e["name"]) for e in json.load(sys.stdin)]' || true
          echo "===== wordlists raw listing"; curl -sS "$api/wordlists" | head -c 600; echo
          for f in main_de.combined.gz main_de.combined main_de_wordlist.combined.gz; do
            if curl -fsSL -o $f $raw/wordlists/$f; then
              echo "===== $f $(stat -c %s $f)"
              (zcat -f $f) > de.txt
              echo "lines: $(wc -l < de.txt) words: $(grep -c '^ word=' de.txt) bigram lines: $(grep -c 'bigram=' de.txt)"
              head -12 de.txt; grep -m5 'bigram=' de.txt || true
            else echo "no $f"; fi
          done
