name: Dictionary check
on:
  push:
    branches: [ ci/dict-check ]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Look
        run: |
          raw=https://codeberg.org/Helium314/aosp-dictionaries/raw/branch/main
          curl -fsSL -o wordlist.py $raw/scripts/wordlist.py
          echo "===== bigram f in wordlist.py"; grep -n "bigram" wordlist.py | head -40
          n=$(grep -n "def create_wordlist_combined" wordlist.py | cut -d: -f1); sed -n "$n,$((n+80))p" wordlist.py
          echo "===== en_US"; curl -fsSL $raw/wordlists/main_en_US.combined.gz -o en.gz && zcat en.gz | sed -n '1,40p'
          echo "===== en_US bigram f values"; zcat en.gz | grep 'bigram=' | sed 's/.*f=//' | sort -n | uniq -c | sort -k2 -n | head -30
          for c in deu_news_2023_1M deu_news_2022_1M deu_news_2024_1M deu-de_web_2021_1M deu-de_web_2019_1M deu_mixed-typical_2011_1M deu_wikipedia_2021_1M deu_web_2019_1M deu-de_web-public_2019_1M deu_newscrawl-public_2019_1M deu_newscrawl_2011_1M; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I https://downloads.wortschatz-leipzig.de/corpora/$c.tar.gz); echo "$c $code"
          done
