name: Run feature tests
# Only for this fork: the complete unit test suite of a branch, to compare with LeanType. Triggered by ci/test-*.
on:
  push:
    branches: [ 'ci/test-*' ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: All unit tests
        run: |
          chmod +x gradlew
          ./gradlew testStandardRunTestsUnitTest testOfflineRunTestsUnitTest --continue 2>&1 | tee gradle.log || true
          grep -E "^e: " gradle.log | head -20 | sed 's/^/::error::/' || true
      - name: Summary
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET, collections
          for variant in ('testStandardRunTestsUnitTest', 'testOfflineRunTestsUnitTest'):
              files = glob.glob(f'app/build/test-results/{variant}/*.xml')
              total = fail = skip = 0
              failed = []
              for f in files:
                  r = ET.parse(f).getroot()
                  for tc in r.iter('testcase'):
                      total += 1
                      if tc.find('skipped') is not None: skip += 1
                      if tc.find('failure') is not None or tc.find('error') is not None:
                          fail += 1
                          el = tc.find('failure') if tc.find('failure') is not None else tc.find('error')
                          failed.append(f"{tc.get('classname')}.{tc.get('name')}: {(el.get('message') or '')[:150]}")
              print(f"RESULT {variant}: {total} tests, {fail} failed, {skip} skipped")
              for x in sorted(failed): print("FAILED", x)
          PY
