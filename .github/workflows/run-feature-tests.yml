name: Run feature tests
# Only for this fork: runs the unit tests touched by the feature branches.
# Triggered by pushing to the branch ci/run-tests.

on:
  push:
    branches: [ ci/run-tests ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: >
          ./gradlew testStandardRunTestsUnitTest
          --tests "helium314.keyboard.latin.InputLogicTest"
          --tests "helium314.keyboard.latin.suggestions.SuggestionStripLayoutHelperTest"
          --tests "helium314.keyboard.latin.heatmap.TypingHeatmapTest"

      - name: Report failures as annotations
        if: ${{ failure() }}
        run: |
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fl in tc.findall('failure'):
                      msg = (fl.get('message') or fl.text or '')[:600].replace('\n', ' ')
                      print(f"::error title={tc.get('name')}::{msg}")
          PY

      - name: Report test counts as annotations
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              r = ET.parse(f).getroot()
              print(f"::notice title={r.get('name')}::tests={r.get('tests')} failures={r.get('failures')} errors={r.get('errors')} skipped={r.get('skipped')}")
          PY

      - name: Archive test reports
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            app/build/test-results
