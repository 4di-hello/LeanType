name: E2E tests on an emulator
# Only in this fork: the real keyboard typing into a real text field, the settings screens, backup
# encryption with the Android crypto provider. Screenshots and logs are kept as the artifact "e2e".
on:
  push:
    branches: [ 'ci/e2e*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          validate-wrappers: true

      - name: Build app and tests
        run: |
          chmod +x gradlew
          ./gradlew assembleOfflineDebug assembleOfflineDebugAndroidTest 2>&1 | tee gradle.log
          grep -E "^e: " gradle.log | head -20 | sed 's/^/::error::/' || true
          test -n "$(find app/build/outputs/apk/androidTest -name '*.apk')"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # a phone screen, and no hardware keyboard: with one, LeanType shows only the toolbar
          profile: pixel_6
          enable-hw-keyboard: false
          pre-emulator-launch-script: |
            for f in ~/.android/avd/*.avd/config.ini; do sed -i '/^hw.keyboard/d' "$f"; echo "hw.keyboard=no" >> "$f"; done
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/e2e/run.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: e2e
          path: e2e-out
          retention-days: 7

  # the screenshots must be looked at: kept on the branch e2e-results, this job runs no code of the repository
  results:
    needs: e2e
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e
          path: out

      - name: Push to branch e2e-results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          mkdir -p files
          if [ -f files.tar ]; then tar -xf files.tar -C files --no-same-owner || true; rm -f files.tar; fi
          git init -q -b e2e-results
          git config user.name 4di-hello
          git config user.email 4di-hello@users.noreply.github.com
          git add -A
          git commit -q -m "E2E results of ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" e2e-results
