name: Debug APK to branch
# Only for this fork: builds the debug APKs and stores them on the branch apk-out,
# so they can be fetched with git. Triggered by pushing to ci/apk.

on:
  push:
    branches: [ ci/apk ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Use the fixed debug key (secret DEBUG_KEYSTORE_B64), so updates install over the previous version
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > ~/.android/debug.keystore
            echo "::notice::fixed debug key used"
          else
            echo "::warning::secret DEBUG_KEYSTORE_B64 missing, APK is signed with a random key"
          fi

      - name: Build debug APKs
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Push APKs to branch apk-out
        run: |
          mkdir /tmp/out
          find app/build/outputs/apk -name '*.apk' -exec cp {} /tmp/out/ \;
          cd /tmp/out
          git init -q -b apk-out
          git config user.name 4di-hello
          git config user.email 4di-hello@users.noreply.github.com
          git add .
          git commit -q -m "Debug APKs for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-out
